.bar{height:5px;border-radius:0;background:var(--tan1);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--tan)}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:86px;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);box-shadow:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:14px;font:600 9.5px 'Nunito Sans';color:var(--ink3)}
.tab .pl{width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.tab.on{color:var(--ink);font-weight:700}
.tab.on .pl{background:transparent}
.bottombar{position:absolute;left:0;right:0;bottom:0;padding:16px 24px 32px;background:var(--card);border-top:1px solid var(--line)}
.divider{height:1px;background:var(--line)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:20px 20px 0 0;border-top:1px solid var(--line);box-shadow:0 -12px 24px rgba(58,29,10,.07);padding:16px 24px 28px}
.handle{width:48px;height:5px;border-radius:3px;background:var(--tan3);margin:0 auto 14px}
.badge{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
