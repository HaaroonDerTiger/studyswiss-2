name: studyswiss
description: StudySwiss — Vorbereitung auf die Zentrale Aufnahmeprüfung.
publish_to: none
# 2.0.0, nicht 1.0.0: Im App Store steht bereits 1.2.3 als READY_FOR_SALE.
# Eine kleinere Versionsnummer weist App Store Connect zurueck.
#
# Buildnummer 36: 35 wurde am 31.8. gebaut, aber nie hochgeladen. Die Nummer
# muss ueber alle Versionen hinweg steigen; eine schon vergebene wird beim
# Hochladen abgelehnt, und zwar erst nach dem Bau.
version: 2.0.0+36

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  sign_in_with_apple: ^6.1.2
  google_sign_in: ^6.2.1
  in_app_purchase: ^3.2.0
  in_app_purchase_android: ^0.3.6
  in_app_purchase_storekit: ^0.3.19
  crypto: ^3.0.5
  # `flutter_localizations` bindet `intl` fest. Wer hier eine aeltere
  # Fassung verlangt, bekommt gar keine Aufloesung mehr.
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/marke/
    - assets/studi/


# Die Schriften kommen über `google_fonts` und werden beim ersten Start
# geladen und dann zwischengespeichert. Wer sie fest einbauen will, legt die
# TTF-Dateien unter assets/schriften/ ab und trägt hier einen `fonts:`-Block
# ein — dann sieht die App auch beim allerersten Start ohne Netz richtig aus.
